<!DOCTYPE html>
<html lang="nl">
<head>
  <base href="../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f7259" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Growify" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/pwa-icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png" />
  <title>Wachtwoord herstellen | Growify</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="herstel.css" />
</head>
<body>
  <a class="skip-link" href="herstel/#recovery-main">Ga naar hoofdinhoud</a>
  <header class="recovery-header">
    <a class="brand" href="./" aria-label="Growify startpagina"><span class="brand-mark" aria-hidden="true">✦</span><span>growify</span></a>
  </header>
  <div class="accessibility-tools recovery-accessibility-tools">
    <details class="accessibility-menu">
      <summary aria-controls="accessibility-options">
        <span aria-hidden="true">Aa</span>
        <span>Toegankelijkheid</span>
        <span class="accessibility-menu-chevron" aria-hidden="true">⌄</span>
      </summary>
      <div class="accessibility-menu-panel" id="accessibility-options" role="group" aria-label="Weergavevoorkeuren">
        <button class="accessibility-toggle" type="button" aria-label="Grotere tekst instellen" aria-pressed="false">
          <span aria-hidden="true">A+</span>
          <span class="accessibility-toggle-label">Grotere tekst</span>
        </button>
        <button class="contrast-toggle" type="button" aria-label="Hoog contrast instellen" aria-pressed="false">
          <span aria-hidden="true">HC</span>
          <span class="accessibility-toggle-label">Hoog contrast</span>
        </button>
      </div>
    </details>
  </div>
  <main class="recovery-page" id="recovery-main" tabindex="-1">
    <section class="recovery-card auth-content" aria-labelledby="recovery-title">
      <p class="eyebrow">Jouw groene account</p>
      <h1 id="recovery-title">Wachtwoord <em>herstellen.</em></h1>
      <p id="recovery-intro">Vul je e-mailadres in. Als er een account bestaat, ontvang je een link om een nieuw wachtwoord te kiezen.</p>
      <form id="recovery-request">
        <label>E-mailadres<input id="recovery-email" type="email" autocomplete="email" required /></label>
        <button class="primary-button" type="submit">Stuur herstellink</button>
      </form>
      <form id="recovery-update" hidden>
        <label>Nieuw wachtwoord<input id="recovery-password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <label>Herhaal nieuw wachtwoord<input id="recovery-confirm" type="password" autocomplete="new-password" minlength="8" required /></label>
        <button class="primary-button" type="submit">Nieuw wachtwoord opslaan</button>
      </form>
      <p class="auth-status" id="recovery-status" role="status" aria-live="polite"></p>
      <a class="text-button" href="./?account=1">Terug naar inloggen</a>
    </section>
  </main>
  <script src="assets/supabase-client.js"></script>
  <script src="account.js"></script>
  <script src="herstel.js"></script>
  <script src="pwa.js"></script>
  <script src="toegankelijkheid.js"></script>
</body>
</html>
